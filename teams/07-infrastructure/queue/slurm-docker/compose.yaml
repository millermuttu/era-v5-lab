# Slurm test cluster: database, controller and two compute nodes with 8 fake GPUs each.
x-slurm: &slurm
  build: .
  image: lab-slurm
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: slurm
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 2s
      retries: 30
  slurmdbd:
    <<: *slurm
    hostname: slurmdbd
    command: slurmdbd
    depends_on: {mariadb: {condition: service_healthy}}
  slurmctld:
    <<: *slurm
    hostname: slurmctld
    command: slurmctld
    depends_on: [slurmdbd]
  c1: {<<: *slurm, hostname: c1, command: slurmd, depends_on: [slurmctld]}
  c2: {<<: *slurm, hostname: c2, command: slurmd, depends_on: [slurmctld]}
