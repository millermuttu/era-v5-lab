# Install as /etc/slurm/slurmdbd.conf, owner slurm, mode 600.
# Set StoragePass on the node only. Never commit the real password.
AuthType=auth/munge
DbdHost=localhost
SlurmUser=slurm
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=localhost
StorageUser=slurm
StoragePass=SET_ON_THE_NODE
StorageLoc=slurm_acct_db
