# The shared GPU node (week 2): slurmctld, slurmdbd and slurmd all run on it.
# Before use, replace NODE with the output of `hostname -s`, and the NodeName line with `slurmd -C`
# (keep Gres=gpu:8). Not tested yet: there is no node until 1 Nov.
SlurmctldHost=NODE
AccountingStorageHost=NODE
# cgroups hold each job to its CPUs, memory and GPUs.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
NodeName=NODE CPUs=0 RealMemory=0 Gres=gpu:8 State=UNKNOWN
PartitionName=gpu Nodes=NODE Default=YES MaxTime=INFINITE State=UP
