ClusterName=lab
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# No cgroups inside Docker.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2

# Accounting: jobs must run under an account the user belongs to, and QOS limits hold.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos,safe

# Fake GPUs: counted by Slurm, not bound to any device.
GresTypes=gpu
NodeName=c[1-2] CPUs=4 RealMemory=1000 Gres=gpu:8 State=UNKNOWN
PartitionName=gpu Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
