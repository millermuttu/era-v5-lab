# Shared by the Docker test cluster and the real node. Only site.conf differs:
# docker/site.conf here, node/site.conf on the GPU node.
ClusterName=lab
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
ReturnToService=2

# Accounting: jobs must run under an account the user belongs to, and QOS limits hold.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos,safe
GresTypes=gpu

# Hosts, nodes, partitions and the cgroup plugins.
Include /etc/slurm/site.conf
